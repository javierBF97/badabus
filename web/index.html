<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>badabus</title>
  <script>
    (function () {
      var guardado = localStorage.getItem("tema");
      var tema = (guardado === "claro" || guardado === "oscuro")
        ? guardado
        : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro");
      document.documentElement.dataset.theme = tema;
      // The language goes in before the first paint too: otherwise the texts come out
      // in Spanish and jump to English when the script starts.
      var idioma = localStorage.getItem("idioma");
      if (idioma !== "es" && idioma !== "en") {
        idioma = String(navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es";
      }
      document.documentElement.lang = idioma;
    })();
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <div class="wordmark"><span class="dot"></span>badabus</div>
    <div class="busqueda">
      <input id="buscar-parada" type="text" placeholder="Buscar parada…" data-i18n-ph="buscar_parada_ph"
        aria-label="Buscar parada" data-i18n-aria="buscar_parada_aria"
        autocomplete="off" role="combobox" aria-expanded="false" aria-controls="resultados-busqueda" aria-autocomplete="list">
      <div id="resultados-busqueda" role="listbox" hidden></div>
    </div>
    <div class="acciones">
      <button id="btn-comollegar" type="button" aria-haspopup="true" aria-expanded="false" data-i18n="como_llegar">Cómo llegar</button>
      <button id="btn-lineas" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="btn-chip" id="btn-chip" style="display:none"></span>
        <span id="btn-texto" data-i18n="lineas">Líneas</span>
      </button>
      <button id="locate" type="button" data-i18n="parada_cercana">Parada más cercana</button>
      <button id="lang-toggle" type="button" aria-label="View in English" data-i18n-aria="cambiar_idioma">
        <span id="lang-texto">EN</span>
      </button>
      <button id="theme-toggle" type="button" aria-label="Cambiar tema" aria-pressed="false">
        <span class="icono-sol" aria-hidden="true">&#9728;</span>
        <span class="icono-luna" aria-hidden="true">&#9789;</span>
      </button>
    </div>
  </header>
  <main>
    <div id="map"></div>
  </main>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="scrim-lineas" hidden></div>
  <aside id="panel-lineas" hidden role="dialog" aria-modal="true" aria-label="Elegir línea" data-i18n-aria="elegir_linea">
    <div class="panel-lineas-cabecera">
      <span data-i18n="elige_linea">Elige una línea</span>
      <button type="button" id="cerrar-lineas" aria-label="Cerrar" data-i18n-aria="cerrar">&times;</button>
    </div>
    <div id="chips-lineas"></div>
  </aside>
  <div id="scrim-comollegar" hidden></div>
  <aside id="panel-comollegar" hidden role="dialog" aria-modal="true" aria-label="Cómo llegar" data-i18n-aria="como_llegar">
    <div class="panel-lineas-cabecera">
      <span data-i18n="como_llegar">Cómo llegar</span>
      <button type="button" id="cerrar-comollegar" aria-label="Cerrar" data-i18n-aria="cerrar">&times;</button>
    </div>
    <div class="cl-campo">
      <div class="cl-label" data-i18n="origen">Origen</div>
      <div id="cl-origen"></div>
    </div>
    <button type="button" id="cl-invertir" class="cl-invertir" aria-label="Invertir origen y destino" data-i18n-aria="invertir">⇅</button>
    <div class="cl-campo">
      <div class="cl-label" data-i18n="destino">Destino</div>
      <div id="cl-destino"></div>
    </div>
    <button type="button" id="cl-buscar" class="cl-buscar-ruta" data-i18n="buscar_ruta">Buscar ruta</button>
    <div id="cl-resultados"></div>
  </aside>
</body>
</html>
